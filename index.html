<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeliard Web Port</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="intro-screen" class="intro-screen">
    <canvas id="introCanvas" width="640" height="400" aria-label="Opening title"></canvas>
  </section>

  <div id="intro-actions" class="touch-controls" aria-hidden="true">
    <button class="touch-action-btn" data-code="Space" aria-label="Hit / Action">⚔️</button>
  </div>

  <!-- <div id="fps-display">FPS: <span id="fps-value">0</span></div> -->
  <div id="ui" class="hidden">
    <span class="group">Controls:</span>&nbsp;&nbsp;
    <span class="key">⬅⬆➡⬇</span> Move/Climb/Jump/Squat&nbsp;&nbsp;
    <span class="key">Space</span> Hit/Action&nbsp;&nbsp;
    <span class="key">Alt</span> Magics &nbsp;&nbsp;
    <span class="key">Enter</span> Inventory<br>
    <span class="key">F1</span> Music On/Off&nbsp;&nbsp;
    <span class="key">F2</span> Sound FX On/Off&nbsp;&nbsp;
    <span class="key">F7</span> Restore/Restart&nbsp;&nbsp;
    <span class="key">F8</span> Import/Export&nbsp;&nbsp;
    <span class="key">F9</span> Change Speed&nbsp;&nbsp;
  </div>

  <div id="layout-wrapper" class="hidden" style="display: flex; align-items: flex-start; justify-content: center; width: 100%; max-width: 1200px;">

    <div id="touch-joystick" class="touch-controls" aria-hidden="true">
      <button class="touch-dpad-btn" data-codes="ArrowUp,ArrowLeft" aria-label="Up-Left"><span class="touch-dpad-arrow touch-dpad-arrow--nw"></span></button>
      <button class="touch-dpad-btn" data-codes="ArrowUp" aria-label="Up"><span class="touch-dpad-arrow touch-dpad-arrow--up"></span></button>
      <button class="touch-dpad-btn" data-codes="ArrowUp,ArrowRight" aria-label="Up-Right"><span class="touch-dpad-arrow touch-dpad-arrow--ne"></span></button>
      <button class="touch-dpad-btn" data-codes="ArrowLeft" aria-label="Left"><span class="touch-dpad-arrow touch-dpad-arrow--left"></span></button>
      <span class="touch-dpad-cell"></span>
      <button class="touch-dpad-btn" data-codes="ArrowRight" aria-label="Right"><span class="touch-dpad-arrow touch-dpad-arrow--right"></span></button>
      <span class="touch-dpad-cell"></span>
      <button class="touch-dpad-btn" data-codes="ArrowDown" aria-label="Down"><span class="touch-dpad-arrow touch-dpad-arrow--down"></span></button>
      <span class="touch-dpad-cell"></span>
    </div>

    <img src="assets/images/mole/mole_l.jpg" class="mole-side">
    <div id="game-wrapper" style="display: flex; flex-direction: column; width: fit-content;">
      <div id="mole-top" style="position: relative; width: 672px; height: 42px;">
        <img src="assets/images/mole/mole_t.jpg" style="width: 672px; height: 42px; display: block;">
        <div id="tear-overlay" style="position: absolute; top: 0; left: 0; width: 672px; height: 42px; pointer-events: none;"></div>
      </div>
      <div id="game-container">
          <canvas id="gameCanvas"></canvas>
      </div>

      <div class="zeliard-hud">
        <div class="stats-panel">
          
          <div class="hud-row life-row"> <!-- Life -->
            <span class="label">LIFE</span>
            <div class="life-bar-container">
              <div class="life-fill life-fill-max"></div>
              <div class="life-fill life-fill-current"></div>
              <div class="ticks"></div>
            </div>
          </div>

          <div class="hud-row place-row"> <!-- Place / Enemy HP -->
            <span class="label" id="placeLabel">PLACE</span>
            <span class="value" id="currentMapName"></span>
            <div class="life-bar-container hidden" id="bossLifeBarContainer">
              <div class="life-fill life-fill-max"></div>
              <div class="life-fill life-fill-current"></div>
              <div class="ticks"></div>
            </div>
          </div>

          <div class="hud-row split-row"> <!-- Gold / Almas -->
            <div class="currency-box" id="goldBox"> <!-- gold / boss name -->
              <span class="label" id="goldLabel">GOLD</span>
              <span class="value" id="gold">0</span>
            </div>
            <div class="currency-box"> <!-- almas -->
              <span class="label label-almas">ALMAS</span>
              <span class="value" id="almas">0</span>
            </div>
          </div>
        </div>

        <div class="inventory-panel">
          <div class="slot-wrapper"> <!-- sword -->
            <div class="slot active-slot" id="activeSwordSlot"><img id="activeSwordIcon" /></div>
          </div>
          <div class="slot-wrapper"> <!-- magic -->
            <div class="slot" id="activeMagicSlot"><img id="activeSpellIcon" /></div>
            <div class="slot-counter" id="spellCounter"></div>
          </div>
          <div class="slot-wrapper"> <!-- shield -->
            <div class="slot" id="activeShieldSlot"><img id="activeShieldIcon" /></div>
            <div class="slot-counter" id="shieldHp"></div>
          </div>
        </div>
      </div>

    </div>
    <img src="assets/images/mole/mole_r.jpg" class="mole-side">

    <div id="touch-actions" class="touch-controls" aria-hidden="true">
      <button class="touch-action-btn" data-code="Enter" aria-label="Inventory">🎒</button>
      <button class="touch-action-btn" data-code="AltLeft" aria-label="Magic">🪄</button>
      <button class="touch-action-btn" data-code="Space" aria-label="Hit / Action">⚔️</button>
    </div>
  </div>

  <div id="settings-menu">
    <button id="settings-toggle" aria-label="Settings" title="Settings">⚙</button>
    <button id="fullscreen-toggle" aria-label="Fullscreen" title="Fullscreen">⛶</button>
    <div id="settings-panel" class="hidden">
      <button data-key="F1">Music On/Off</button>
      <button data-key="F2">Sound FX On/Off</button>
      <button data-key="F7">Restore / Restart</button>
      <button data-key="F8">Import / Export</button>
      <button data-key="F9">Change Speed</button>
    </div>
  </div>

  <button id="escape-toggle" aria-label="Cancel / Back" title="Cancel / Back">❌</button>
  </div>

  <div id="name-pad" class="hidden" aria-hidden="true"></div>

  <div id="speed-pad" class="hidden" aria-hidden="true">
    <button class="speed-digit" data-digit="1">1</button>
    <button class="speed-digit" data-digit="2">2</button>
    <button class="speed-digit" data-digit="3">3</button>
    <button class="speed-digit" data-digit="4">4</button>
    <button class="speed-digit" data-digit="5">5</button>
    <button class="speed-digit" data-digit="6">6</button>
    <button class="speed-digit" data-digit="7">7</button>
    <button class="speed-digit" data-digit="8">8</button>
    <button class="speed-digit" data-digit="9">9</button>
    <button class="speed-digit" data-digit="0">0</button>
    <button class="speed-pad-wide" id="speed-cancel">CANCEL</button>
    <button class="speed-pad-wide" id="speed-ok">OK</button>
  </div>

  <script src="game.js" type="module"></script>
  <script src="touch-controls.js" type="module"></script>
</body>
</html>
